# ==============================================================================
# AEQUIFY CONFIGURATION - EXAMPLE FILE
# ==============================================================================
# This is a comprehensive sample configuration with detailed explanations.
# Copy this file to config.yaml and customize for your use case.
#
# APEX Engine Documentation: src/aequify/engine/apex/apex.md
# ==============================================================================

# ==============================================================================
# TRADING CONFIGURATION
# ==============================================================================
# Controls order execution and risk management.
# IMPORTANT: Start with enabled=false to observe signals before trading.
# ==============================================================================
trading:
  # ---------------------------------------------------------------------------
  # Master Switch
  # ---------------------------------------------------------------------------
  # false = Read-only mode (signals generated, NO orders placed)
  # true  = Trading enabled (orders will be placed)
  #
  # RECOMMENDATION: Start with false, monitor for 24-48h, then enable
  enabled: true

  # ---------------------------------------------------------------------------
  # Trading Environment
  # ---------------------------------------------------------------------------
  # demo = Binance Futures Testnet (fake money, safe for testing)
  # live = Real Binance Futures (REAL MONEY - use with extreme caution)
  #
  # IMPORTANT: Test extensively on demo before using live!
  # Testnet: https://testnet.binancefuture.com
  mode: demo

  # ---------------------------------------------------------------------------
  # Trading Blackout Windows
  # ---------------------------------------------------------------------------
  # Disable trading during these UTC time windows [HHMM, HHMM]
  # Useful for avoiding high volatility periods (funding, news events)
  #
  # Examples:
  # - [2355, 0005] = Around UTC midnight (funding time)
  # - [0755, 0805] = Around 8:00 UTC (funding time)
  # - [1555, 1605] = Around 16:00 UTC (funding time)
  disable_trading_on_window_utc:
    - [2358, 2359]

  # ---------------------------------------------------------------------------
  # Risk Management
  # ---------------------------------------------------------------------------
  risk:
    # Maximum concurrent open positions across all symbols
    # Lower = Less risk exposure, Higher = More opportunities
    # RECOMMENDATION: 5-10 for conservative, 15-25 for aggressive
    max_positions: 20

    # Daily loss circuit breaker (percentage of account)
    # Trading stops when daily realized loss exceeds this threshold
    # RECOMMENDATION: 2-5% for conservative, 5-10% for aggressive
    max_daily_loss_pct: 5.0

  # ---------------------------------------------------------------------------
  # Futures Settings
  # ---------------------------------------------------------------------------
  futures:
    # Margin mode: CROSS or ISOLATED
    # CROSS  = Shared margin, higher liquidation risk, capital efficient
    # ISOLATED = Per-position margin, contained risk, less capital efficient
    margin_mode: "CROSS"

    # Leverage multiplier (1-125x on Binance)
    # Higher leverage = Higher profit/loss, closer liquidation price
    #
    # RECOMMENDATION BY RISK PROFILE:
    # - Conservative: 3-5x
    # - Moderate: 5-10x
    # - Aggressive: 10-20x
    # - Degen: 20x+ (not recommended)
    leverage: 10

    # LONG position settings (buy low, sell high)
    long:
      enabled: true
      # Initial entry size in USDT (first entry for new position)
      initial_entry_size_usdt: 6.5
      # Maximum total position size including DCA entries
      maximum_position_size_usdt: 180.0

    # SHORT position settings (sell high, buy low)
    short:
      enabled: true
      initial_entry_size_usdt: 6.5
      maximum_position_size_usdt: 180.0

# ==============================================================================
# SYMBOL FILTERS
# ==============================================================================
# Filters determine which symbols are monitored and traded.
# Filters run in ORDER - put most restrictive first for efficiency.
#
# IMPORTANT RULES:
# - Active positions are ALWAYS included regardless of filters
# - symbol_filter MUST be LAST (for blacklist/whitelist to work correctly)
# ==============================================================================
filters:
  # ---------------------------------------------------------------------------
  # Price Change Filter
  # ---------------------------------------------------------------------------
  # Selects top N symbols by 24h absolute price change percentage.
  # APEX works best on volatile altcoins that show clear patterns.
  #
  # USE CASE EXAMPLES:
  # - top: 50  = Conservative, focus on most volatile coins
  # - top: 100 = Moderate, good balance of opportunity vs noise
  # - top: 200 = Aggressive, more signals but lower quality
  - name: "absolute_price_percentage_change"
    enabled: true
    config:
      top: 100

  # ---------------------------------------------------------------------------
  # Symbol Filter (MUST BE LAST)
  # ---------------------------------------------------------------------------
  # Blacklist/whitelist specific symbols.
  #
  # BLACKLIST USE CASES:
  # - Large caps (BTC, ETH): Too stable for APEX momentum strategy
  # - Problem symbols: Known manipulation, delisting, etc.
  # - Personal preference: Symbols you don't want to trade
  #
  # WHITELIST USE CASES:
  # - Focus mode: Trade only specific symbols you've researched
  # - Testing: Limit to 1-2 symbols during initial testing
  # - Sector focus: Only meme coins, only AI coins, etc.
  - name: "symbol_filter"
    enabled: true
    config:
      pair: "USDT" # Only USDT-margined futures

      # Symbols to EXCLUDE (always filtered out)
      blacklist:
        # Large caps - too stable for momentum strategy
        - "BTC"
        - "ETH"
        - "SOL"
        - "XRP"
        - "ADA"
        - "DOT"
        - "LINK"
        - "BCH"
        - "LTC"
        - "AIA"

      # Symbols to INCLUDE (if set, ONLY these are traded)
      # Leave empty [] to trade all non-blacklisted symbols
      whitelist: []
      # Example: Focus on specific symbols
      # whitelist:
      #   - "PEPE"
      #   - "WIF"

# ==============================================================================
# APEX ENGINE CONFIGURATION
# ==============================================================================
# APEX (Adaptive Parameter Exploration) is the core trading engine.
# It uses GPU-accelerated grid search to find optimal parameters for each symbol.
#
# KEY CONCEPT: Config defines SEARCH BOUNDS, APEX finds the OPTIMAL POINT.
# Parameters are continuously updated as market conditions change.
#
# PER-SYMBOL OVERRIDES: Place YAML files in config/overrides/ named after
# the symbol (e.g., PIPPINUSDT.yaml) to override these defaults.
#
# RESEARCH: See playground/apex_*.py for experiments and validation.
# ==============================================================================
engines:
  apex:
    # -------------------------------------------------------------------------
    # Processing Mode
    # -------------------------------------------------------------------------
    # GPU = CUDA-accelerated (NVIDIA required) - 40-45B trades/sec
    # CPU = Fallback mode (much slower, not recommended)
    processing: GPU

    # -------------------------------------------------------------------------
    # Data Validation Requirements
    # -------------------------------------------------------------------------
    # Minimum hours of trade history required for bootstrap
    # Too low = Overfitting to noise, Too high = Slow startup
    # RECOMMENDATION: 1-4 hours for volatile altcoins
    min_warm_duration_hours: 1.0

    # Maximum age of historical data (hours)
    # Data older than this is considered stale and ignored
    # RECOMMENDATION: 24-72 hours (markets change quickly)
    max_warm_age_hours: 48.0

    # Minimum entries required for statistically valid parameters
    # If grid search finds fewer entries, params are marked invalid
    # RECOMMENDATION: 5-10 (too high = no params found)
    min_entries_for_validity: 5

    # -------------------------------------------------------------------------
    # Volume Delta Settings
    # -------------------------------------------------------------------------
    # Volume delta = (buy_volume - sell_volume) / total_volume * 100
    # Measures buying vs selling pressure in the market
    volume_delta:
      # Rolling window in milliseconds for delta calculation
      # Lower = More responsive to recent volume, noisier signals
      # Higher = Smoother signals, may lag behind quick moves
      # RECOMMENDATION: 60000-300000 ms (1-5 minutes)
      window_ms: 300000

    # -------------------------------------------------------------------------
    # Bootstrap Configuration
    # -------------------------------------------------------------------------
    # GPU grid search optimization settings
    bootstrap:
      # Maximum trades to analyze (0 = use all available)
      max_trades: 10000000

      # -----------------------------------------------------------------------
      # Lookback Windows
      # -----------------------------------------------------------------------
      # Time windows in milliseconds for rolling high/low price detection.
      # Used to detect price drops (LONG) or rises (SHORT) within a time period.
      #
      # Lower values = More responsive, more signals, lower quality
      # Higher values = Smoother, fewer signals, higher quality
      lookback_windows_ms:
        - 900000 # 15 minutes
        - 1800000 # 30 minutes
        - 2700000 # 45 minutes
        - 3600000 # 1 hour
        - 14400000 # 4 hours

      # -----------------------------------------------------------------------
      # Position Parameters (Exit Strategy)
      # -----------------------------------------------------------------------
      # These define the SEARCH SPACE for TP/SL/MaxHold optimization.
      # APEX will find the optimal values within these bounds.
      #
      # Note: TP now primarily comes from session levels (continuous learning).
      # These bounds are used as FALLBACK when no session levels are available.
      position:
        # Fallback Take Profit bounds (percentage)
        # Used when session-based TP levels are not available
        target_profit_pct:
          min: 1.0
          max: 10.0
          step: 0.25
          default: 1.5

        # Stop Loss bounds (negative percentage)
        # Research shows wider stops (-1% to -3%) perform better
        stop_loss_pct:
          min: -3.0
          max: -1.0
          step: 1.0
          default: -1.0

        # Max Hold Time bounds (milliseconds)
        # Maximum time to hold position before timeout exit
        max_hold_time_ms:
          min: 900000 # 15 minutes
          max: 3600000 # 1 hour
          step: 900000 # 15 minute increments
          default: 60000 # 1 minute fallback

      # -----------------------------------------------------------------------
      # LONG Signal Configuration
      # -----------------------------------------------------------------------
      # LONG signal: Price DROPS from recent high + SELLING pressure
      # Action: BUY expecting price to bounce UP
      long:
        # Signal offset: triggers slightly before threshold
        # LONG offset: triggers at (threshold + offset)
        # e.g., -3.5% + 0.25% = triggers at -3.25%
        signal_offset: 0.25

        # How much price must DROP from rolling high to trigger LONG
        # Negative values = price drop percentage
        price_move_pct:
          min: -20.75
          max: -1.75
          step: 3.8
          default: -3.0

        # Selling pressure required (negative delta = more selling than buying)
        # Negative values = net selling pressure percentage
        volume_delta_threshold:
          min: -90
          max: -30
          step: 10
          default: -50

      # -----------------------------------------------------------------------
      # SHORT Signal Configuration
      # -----------------------------------------------------------------------
      # SHORT signal: Price RISES from recent low + BUYING pressure
      # Action: SELL expecting price to drop DOWN
      short:
        # Signal offset: triggers slightly before threshold
        # SHORT offset: triggers at (threshold - offset)
        # e.g., +7.0% - 0.5% = triggers at +6.5%
        signal_offset: 0.5

        # How much price must RISE from rolling low to trigger SHORT
        # Positive values = price rise percentage
        price_move_pct:
          min: 7.0
          max: 42.0
          step: 7.0
          default: 7.0

        # Buying pressure required (positive delta = more buying than selling)
        # Positive values = net buying pressure percentage
        volume_delta_threshold:
          min: 30
          max: 90
          step: 10
          default: 50

      # -----------------------------------------------------------------------
      # GPU Optimization Parameters
      # -----------------------------------------------------------------------
      # Control speed vs accuracy tradeoff in GPU grid search.
      #
      # PERFORMANCE BENCHMARKS (RTX 3060):
      # - max_scan=5000, outer_stride=5  -> 16B trades/sec (most accurate)
      # - max_scan=800, outer_stride=15  -> 42B trades/sec (balanced)
      # - max_scan=500, outer_stride=20  -> 50B+ trades/sec (fastest)
      gpu:
        # Max trades to scan after entry for exit detection
        # Higher = More accurate exit detection, slower
        max_scan: 800

        # Check every Nth trade for entry signals
        # Lower = More entry signals checked, slower
        outer_stride: 15

    # -------------------------------------------------------------------------
    # Continuous Learning (Session-Based Levels)
    # -------------------------------------------------------------------------
    # Computes POC/VAH/VAL/imbalance levels per forex session for dynamic TP/DCA.
    # These levels are used at runtime for position management instead of
    # fixed percentage-based TP/SL from bootstrap.
    continuous_learning:
      # How far back to look for session data (days)
      max_lookback_days: 90

      # Forex sessions to compute levels for
      sessions:
        - "Sydney"
        - "Tokyo"
        - "Mumbai"
        - "Frankfurt"
        - "London"
        - "NY-London"
        - "New York"

      # Minimum distance from current price for a level to be valid as TP
      # Levels closer than this are ignored (avoids tiny TP targets)
      minimum_target_profit_pct_distance: 1.0

      # Minimum distance from current price for a level to be valid as DCA
      # Levels closer than this are ignored (avoids premature DCA entries)
      minimum_dca_pct_distance: 5.0

# ==============================================================================
# DATABASE CONFIGURATION
# ==============================================================================
# Aequify uses a two-tier storage system:
# - Hot Store: In-memory, fast access to recent trades
# - Warm Store: QuestDB, persistent historical data
# ==============================================================================
database:
  # ---------------------------------------------------------------------------
  # Hot Store (In-Memory)
  # ---------------------------------------------------------------------------
  # Fast access to recent trades for real-time signal generation.
  hot:
    # How many days of data to keep in memory
    duration_days: 30

    # Expected trades per second (for memory pre-allocation)
    trades_per_second: 60

    # Extra capacity for traffic bursts (multiplier)
    safety_margin: 1.1

  # ---------------------------------------------------------------------------
  # Warm Store (QuestDB)
  # ---------------------------------------------------------------------------
  # Persistent storage for historical trade data.
  # Used for APEX bootstrap optimization.
  warm:
    enabled: true
    host: "localhost"
    port: 9000
    table: "trades"

  # ---------------------------------------------------------------------------
  # Flush Settings (Hot -> Warm)
  # ---------------------------------------------------------------------------
  flush:
    interval_seconds: 60
    min_trades: 100

# ==============================================================================
# REAL-TIME DATA STREAMS (RTDS)
# ==============================================================================
# Configuration for exchange data streams and position management.
# ==============================================================================
rtds:
  # Exchange identifier (CCXT format)
  exchange: "binanceusdm"

  # Use demo/testnet API endpoints
  # true = Testnet (for testing)
  # false = Production (for live trading)
  demo: false

  # Reconnection settings (0 = unlimited retry attempts)
  max_retries: 0

  # ---------------------------------------------------------------------------
  # Position Monitoring
  # ---------------------------------------------------------------------------
  # Delay after learning completes before next position poll (seconds)
  # Flow: poll positions -> run learning -> wait delay -> repeat
  # Lower = More responsive, more API weight (5 weight per call)
  # RECOMMENDATION: 10-60 seconds
  position_poll_delay: 10

  # Interval to reconcile TP/SL orders with positions (seconds)
  # Ensures orphaned orders are cleaned up and TP/SL are correctly placed
  # RECOMMENDATION: 15-60 seconds
  order_reconciliation_interval: 30

  # ---------------------------------------------------------------------------
  # Symbol Override
  # ---------------------------------------------------------------------------
  # Manually specify symbols to stream (CCXT format)
  # Leave empty [] to use filtered symbols from filters section
  symbols: []

# ==============================================================================
# DEVELOPER SETTINGS
# ==============================================================================
developer:
  # Logging level: DEBUG, INFO, WARNING, ERROR
  log_level: "INFO"

  # Binance API recvWindow (milliseconds)
  # Increase if getting timestamp errors
  recvWindow: 4000
