[project]
name = "aequify"
version = "3.0.1"
description = "aequify"
authors = [{ name = "eins0fx" }]
requires-python = ">= 3.14"
dependencies = [
    "textual[syntax]>=1.0.0",
    "textual-autocomplete>=4.0.0",
    "mojo>=0.26.1.0.dev2025123005",
    "uvloop>=0.21.0",
    "httpx>=0.28.1",
    "ccxt>=4.5.30",
    "psutil>=7.2.1",
    "pynvml>=13.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://dl.modular.com/public/nightly/python/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/aequify"]

[dependency-groups]
dev = [
    "textual-dev>=1.5.1",
    "pytest>=8.3.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "jinja2>=3.1.4",
    "syrupy>=4.6.1",
    "pytest-xdist>=3.6.1",
    "pytest-textual-snapshot>=1.0.0",
    "mkdocs-material>=9.5.30",
    "pyinstrument>=5.0.1",
    "watchfiles>=1.1.1",
]
