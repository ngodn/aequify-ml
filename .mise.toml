# Aequify - mise configuration
# https://mise.jdx.dev

min_version = "2024.9.5"

[env]
PROJECT_NAME = "aequify"
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

[tools]
python = "3.14.2"
uv = "latest"
ruff = "latest"
"java" = { version = "openjdk-17"}

[settings]
python.uv_venv_auto = true

[tasks.reset]
description = "Reset .venv"
run = "rm -rf .venv"

[tasks.install]
description = "Install project dependencies"
depends = ["questdb:setup"]
run = "uv sync"

[tasks.dev]
description = "Install with dev dependencies"
depends = ["questdb:setup"]
run = "uv sync --all-extras"

[tasks.aequify]
description = "Run Aequify TUI"
run = """
#!/usr/bin/env bash
# Clean pycache
find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
# Build kernels
./helper/build-kernels.sh
# Ensure QuestDB is running
if ! ./helper/questdb.sh status 2>&1 | grep -q "RUNNING"; then
    echo "Starting QuestDB..."
    ./helper/questdb.sh start
    sleep 2
fi
uv run mojo -I src src/main.mojo
"""

[tasks.lint]
description = "Run linter"
run = "uv run ruff check src/"

[tasks.lint-fix]
description = "Run linter with auto-fix"
run = "uv run ruff check --fix src/"

[tasks.format]
description = "Format code"
run = "uv run ruff format src/"

[tasks.typecheck]
description = "Run type checker"
run = "uv run mypy src/"

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf .venv dist build *.egg-info .pytest_cache .mypy_cache .ruff_cache"

[tasks.cleancache]
description = "Clean __pycache__ directories"
run = "find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null; echo 'Python cache cleaned'"

[tasks.cleanmojo]
description = "Clean __mojocache__ directories (forces kernel rebuild)"
run = "find . -type d -name '__mojocache__' -exec rm -rf {} + 2>/dev/null; echo 'Mojo cache cleaned'"

[tasks."kernels:build"]
description = "Build APEX GPU kernels (package + bootstrap shared library)"
run = "./helper/build-kernels.sh"

[tasks.watch]
description = "Run Aequify with auto-restart on file changes"
run = "uv run watchfiles 'python -m aequify' src/"

# QuestDB tasks
[tasks.questdb]
description = "Show QuestDB helper usage"
run = "./helper/questdb.sh"

[tasks."questdb:setup"]
description = "Download and install QuestDB binaries"
run = "./helper/questdb.sh setup"

[tasks."questdb:start"]
description = "Start QuestDB server"
run = "./helper/questdb.sh start"

[tasks."questdb:stop"]
description = "Stop QuestDB server"
run = "./helper/questdb.sh stop"

[tasks."questdb:restart"]
description = "Restart QuestDB server"
run = "./helper/questdb.sh restart"

[tasks."questdb:status"]
description = "Show QuestDB status"
run = "./helper/questdb.sh status"

[tasks."questdb:logs"]
description = "Tail QuestDB logs"
run = "./helper/questdb.sh logs"

[tasks."questdb:flush"]
description = "Show flush usage"
run = "./helper/questdb.sh flush"

[tasks."questdb:flush:trades"]
description = "Flush trades table"
run = "./helper/questdb.sh flush trades"

[tasks."questdb:flush:bootstrap_results"]
description = "Flush bootstrap_results table"
run = "./helper/questdb.sh flush bootstrap_results"

[tasks."questdb:flush:bootstrap_bounds"]
description = "Flush bootstrap_bounds table"
run = "./helper/questdb.sh flush bootstrap_bounds"

[tasks."questdb:flush:all"]
description = "Flush all tables"
run = "./helper/questdb.sh flush all"